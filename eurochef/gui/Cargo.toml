[package]
name = "eurochef-gui"
version = "0.1.0"
authors = ["cohaereo <cohaereo@protonmail.com>"]
edition = "2021"
rust-version = "1.65"

[[bin]]
name = "eurochef"
path = "src/main.rs"

[dependencies]
eurochef-edb = { path = "../../eurochef-edb" }
eurochef-filelist = { path = "../../eurochef-filelist" }
eurochef-shared = { path = "../shared" }

anyhow = { version = "1", features = ["backtrace"] }
bytemuck = { version = "1.13", features = ["derive"] }
serde_json = "1"
tracing = "0.1.37"

# GUI
egui = "0.28"
egui_extras = "0.28"
eframe = { version = "0.28", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
fnv = "1.0"
instant = "0.1"
rfd = "0.15"
color-eyre = { version = "0.6.2", features = ["issue-url"] }
crossbeam = "0.8.2"
font-awesome = "0.2"
glow = "0.13"
egui_glow = "0.28"
glam = { version = "0.24.0", features = ["mint"] }
chrono = "0.4.26"
png = "0.17.9"
serde_yaml = "0.9"
parse_int = "0.6.0"
nohash-hasher = "0.2.0"
clap = { version = "4.3.4", features = ["derive"] }
fxhash = "0.2.1"
genmesh = "0.6.2"
bitflags = "2.3.3"
glob = "0.3.1"
hex = "0.4.3"
puffin = "0.19"
puffin_egui = "0.29"

[build-dependencies]
chrono = "0.4.26"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
native-dialog = "0.7.0"
tracing-subscriber = "0.3"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
tracing-wasm = "0.2"
wasm-bindgen-futures = "0.4"
